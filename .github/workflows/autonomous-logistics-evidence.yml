name: Autonomous logistics evidence

on:
  pull_request:
    paths:
      - autonomous_logistics.py
      - test_autonomous_logistics.py
      - data/registry.json
      - web/**
      - README.md
      - AGENTS.md
      - .github/workflows/autonomous-logistics-evidence.yml
  push:
    branches: [main]
    paths:
      - autonomous_logistics.py
      - test_autonomous_logistics.py
      - data/registry.json
      - web/**
      - README.md
      - AGENTS.md
      - .github/workflows/autonomous-logistics-evidence.yml
  schedule:
    - cron: '35 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: autonomous-logistics-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile and unit test
        run: |
          python -m py_compile autonomous_logistics.py test_autonomous_logistics.py
          python -m unittest -v test_autonomous_logistics

      - name: Snapshot verified state before collection
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p build
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          api = Path('api/v1/autonomous-logistics')
          semantic = {}
          for name in ['drone-part135.json', 'trucking.json', 'events.json']:
              rows = json.loads((api / name).read_text())['records']
              cleaned = []
              for row in rows:
                  cleaned.append({
                      key: value for key, value in row.items()
                      if key not in {'source_sha256', 'source_url', 'retrieved_at'}
                  })
              semantic[name] = cleaned
          payload = json.dumps(semantic, sort_keys=True, separators=(',', ':')).encode()
          Path('build/verified-state-before.sha256').write_text(hashlib.sha256(payload).hexdigest() + '\n')
          PY

      - name: Collect primary evidence
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python autonomous_logistics.py \
              --data-root build/data/autonomous-logistics \
              --api-dir build/api/v1/autonomous-logistics
          else
            python autonomous_logistics.py
          fi

      - name: Audit source and status boundaries
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          if '${{ github.event_name }}' == 'pull_request':
              data_root = Path('build/data/autonomous-logistics')
              api = Path('build/api/v1/autonomous-logistics')
          else:
              data_root = Path('data/autonomous-logistics')
              api = Path('api/v1/autonomous-logistics')

          index = json.loads((api / 'index.json').read_text())
          drones = json.loads((api / 'drone-part135.json').read_text())['records']
          trucking = json.loads((api / 'trucking.json').read_text())['records']
          events = json.loads((api / 'events.json').read_text())['records']
          provenance = json.loads((api / 'provenance.json').read_text())
          coverage = index['coverage']

          assert coverage['faa_part135_operator_count'] == 7, coverage
          assert coverage['autonomous_trucking_operator_count'] >= 3, coverage
          assert coverage['commercial_driverless_trucking_operator_count'] >= 3, coverage
          assert coverage['events_2024_or_later'] >= 5, coverage
          assert coverage['primary_source_count'] >= 4, coverage
          assert {row['operator_id'] for row in drones} == {
              'wing-aviation', 'ups-flight-forward', 'amazon-prime-air', 'zipline',
              'causey-aviation-unmanned', 'droneup', 'drone-express'
          }
          assert all('part135_certificate_period' in row for row in drones)
          assert all('part135_certificate_date' not in row for row in drones)
          assert all(row['operation_status'] == 'regulatory_authorization' for row in drones)
          assert all(row['operating_area'] is None for row in drones)
          assert all(row['operating_area_status'] == 'not_listed_as_current_operating_area_on_faa_page' for row in drones)
          assert {row['operator_id'] for row in trucking} >= {'aurora','gatik','kodiak'}
          assert all(row['operation_status'] == 'commercial_driverless' for row in trucking)
          assert all(row['human_driver_in_cab'] is False for row in trucking)
          assert all(row['commercial'] is True for row in trucking)
          assert all(row['source_url'].startswith('https://') and len(row['source_sha256']) == 64 for row in drones + trucking + events)

          for row in provenance['sources']:
              raw = (data_root / row['evidence_path']).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == row['sha256'], row['source_id']
          PY

      - name: Audit public dashboard contract
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('web/index.html').read_text()
          readme = Path('README.md').read_text()
          assert readme.startswith('https://kafka2306.github.io/autonomous-logistics/\n')
          for required in [
              "api/v1/autonomous-logistics/",
              "認可 ≠ 実運用",
              "commercial_driverless",
              "canonical APIの取得または解析に失敗しました",
              "source_sha256",
              "source_url",
              "verified_state_changed_since_previous_collection",
              "今回の取得では、確認済み状態の変更はありません",
          ]:
              assert required in page, required
          assert "fetch(API + path, { cache: 'no-store' })" in page
          assert "fetch('deployment.json', { cache: 'no-store' })" in page
          assert page.count("if (!response.ok) throw new Error") == 2
          PY

      - name: Rebuild API from raw evidence
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DATA_ROOT=build/data/autonomous-logistics
            API_ROOT=build/api/v1/autonomous-logistics
          else
            DATA_ROOT=data/autonomous-logistics
            API_ROOT=api/v1/autonomous-logistics
          fi
          rm -rf build/rebuilt-autonomous-logistics
          python autonomous_logistics.py \
            --offline \
            --data-root "$DATA_ROOT" \
            --api-dir build/rebuilt-autonomous-logistics
          diff -ru "$API_ROOT" build/rebuilt-autonomous-logistics

      - name: Upload pull-request evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: autonomous-logistics-evidence
          path: build
          retention-days: 30

      - name: Commit changed evidence and views
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/autonomous-logistics api/v1/autonomous-logistics
          if git diff --cached --quiet; then
            echo 'No autonomous-logistics evidence change.'
          else
            git commit -m 'data: update autonomous logistics evidence'
            git push
          fi

      - name: Prepare Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          rm -rf build/pages
          mkdir -p build/pages/api/v1/autonomous-logistics
          cp web/index.html build/pages/index.html
          cp api/v1/autonomous-logistics/*.json build/pages/api/v1/autonomous-logistics/
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          api = Path('api/v1/autonomous-logistics')
          events = json.loads((api / 'events.json').read_text())['records']
          latest = max(events, key=lambda row: row['effective_at'])
          semantic = {}
          for name in ['drone-part135.json', 'trucking.json', 'events.json']:
              rows = json.loads((api / name).read_text())['records']
              semantic[name] = [{
                  key: value for key, value in row.items()
                  if key not in {'source_sha256', 'source_url', 'retrieved_at'}
              } for row in rows]
          semantic_payload = json.dumps(semantic, sort_keys=True, separators=(',', ':')).encode()
          current_digest = hashlib.sha256(semantic_payload).hexdigest()
          previous_digest = Path('build/verified-state-before.sha256').read_text().strip()
          payload = {
              'source_commit_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'dataset_retrieved_at': json.loads((api / 'index.json').read_text())['retrieved_at'],
              'latest_event_id': latest['event_id'],
              'latest_event_effective_at': latest['effective_at'],
              'verified_state_changed_since_previous_collection': current_digest != previous_digest,
          }
          Path('build/pages/deployment.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 "${PAGE_URL}index.html" -o index.html
          grep -F '認可 ≠ 実運用' index.html
          grep -F '今回の取得では、確認済み状態の変更はありません' index.html
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 "${PAGE_URL}api/v1/autonomous-logistics/index.json" | python -m json.tool >/dev/null
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 "${PAGE_URL}api/v1/autonomous-logistics/events.json" -o events.json
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 "${PAGE_URL}deployment.json" -o deployment.json
          python - <<'PY'
          import json
          from pathlib import Path
          deployment = json.loads(Path('deployment.json').read_text())
          events = json.loads(Path('events.json').read_text())['records']
          latest = max(events, key=lambda row: row['effective_at'])
          assert len(deployment['source_commit_sha']) == 40
          assert deployment['dataset_retrieved_at']
          assert deployment['latest_event_id'] == latest['event_id']
          assert deployment['latest_event_effective_at'] == latest['effective_at']
          assert isinstance(deployment['verified_state_changed_since_previous_collection'], bool)
          PY
