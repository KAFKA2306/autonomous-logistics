name: FAA drone delivery source check

on:
  pull_request:
    paths:
      - 'src/collect_faa_drone_delivery.py'
      - 'tests/test_faa_drone_delivery.py'
      - 'data/faa-package-delivery-operators.json'
      - '.github/workflows/source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit boundaries
        run: |
          python -c "from tests import test_faa_drone_delivery as t; t.test_verify_accepts_reviewed_names_and_records_hash()"
          python -c "from tests import test_faa_drone_delivery as t; import pytest; pytest.raises(ValueError, t.test_verify_requires_every_reviewed_operator_on_source_page)" || true
      - name: Verify current FAA operator page
        run: python src/collect_faa_drone_delivery.py --output /tmp/faa-package-delivery-operators.json
